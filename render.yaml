services:
  - type: web
    name: bliss-planner
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BLISS_PUBLIC_APP_URL
        value: https://bliss-planner.onrender.com
      - key: BLISS_RELAY_STORE_BACKEND
        value: file
      - key: BLISS_RELAY_STORE_DIR
        value: /var/data/bliss-relay
      - key: BLISS_RELAY_STORE_FILE
        value: bliss-planner-hosted-relay-store.json
      - key: BLISS_RELAY_TOKEN_VERSION
        value: 1
      - key: BLISS_RELAY_AUDIT_RETENTION_DAYS
        value: 90
      - key: BLISS_RELAY_EVENT_RETENTION_DAYS
        value: 365
      - key: BLISS_RELAY_SECRET
        sync: false
      - key: BLISS_RELAY_TOKEN
        sync: false
      - key: BLISS_AUTH_PROVIDER
        value: google
      - key: BLISS_AUTH_CLIENT_ID
        sync: false
      - key: BLISS_AUTH_CLIENT_SECRET
        sync: false
      - key: BLISS_AUTH_SESSION_SECRET
        sync: false
      - key: BLISS_AUTH_ALLOWED_DOMAIN
        sync: false
      - key: BLISS_RESEND_API_KEY
        sync: false
      - key: BLISS_EMAIL_FROM
        value: Bliss Planner <noreply@blissplanner.app>
      - key: BLISS_EMAIL_PROVIDER
        value: queued
      - key: BLISS_EMAIL_WEBHOOK_URL
        sync: false
      - key: BLISS_EMAIL_WEBHOOK_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: BLISS_RELAY_DATABASE_URL
        sync: false
      - key: BLISS_FILE_STORE_DIR
        value: /var/data/bliss-relay/files
      - key: BLISS_OBJECT_STORAGE_BUCKET
        sync: false
      - key: BLISS_OBJECT_STORAGE_REGION
        sync: false
      - key: BLISS_OBJECT_STORAGE_UPLOAD_ENDPOINT
        sync: false
      - key: BLISS_OBJECT_STORAGE_TOKEN
        sync: false
      - key: BLISS_ADMIN_EMAILS
        sync: false
      - key: BLISS_PLANNER_EMAILS
        sync: false
      - key: BLISS_PORTAL_CLIENT_EMAILS
        sync: false
      - key: BLISS_PORTAL_VENDOR_EMAILS
        sync: false
    disk:
      name: bliss-relay-data
      mountPath: /var/data/bliss-relay
      sizeGB: 1
